<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>翰林國語三上 全冊生字筆順練習教室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    .font-moe {
      font-family: "DFKai-SB", "BiauKai", "TW-Kai", "Noto Serif TC", serif !important;
    }
    .tianzige-container {
      position: relative;
      width: 380px;
      height: 380px;
      max-width: 100%;
      background-color: #ffffff;
      border: 3px solid #dc2626;
      border-radius: 1rem;
      overflow: hidden;
      touch-action: none;
      box-shadow: none !important;
    }
    .tianzige-grid {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    #writer-target, #moe-view-target {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #moe-view-target {
      display: none;
    }
    #writer-target svg, #moe-view-target svg {
      display: block;
      margin: 0 auto;
    }
    .horizontal-scroll::-webkit-scrollbar {
      height: 6px;
    }
    .horizontal-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 9999px;
    }
    .horizontal-scroll::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 9999px;
    }
    * {
      box-shadow: none !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-800">
  <!-- 頁首與課次選擇列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-900 text-white flex items-center justify-center font-serif text-2xl font-bold border border-indigo-950">
          字
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-bold text-slate-900">翰林三上 生字筆順練習教室</h1>
            <span class="text-xs bg-indigo-100 text-indigo-800 font-semibold px-2 py-0.5 rounded-full border border-indigo-200 hidden md:inline-block">翰林全冊176字</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2.5 flex-wrap">
        <div class="flex items-center gap-1.5 bg-slate-100 rounded-xl p-1 border border-slate-200">
          <span class="text-xs text-indigo-700 ml-1.5 font-bold">課次</span>
          <select id="lesson-select" class="bg-transparent text-xs sm:text-sm font-semibold text-slate-700 py-1 pr-2 rounded-lg focus:outline-none cursor-pointer">
          </select>
        </div>

        <button id="btn-read-character" class="text-xs sm:text-sm flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-indigo-700 text-white hover:bg-indigo-800 transition font-medium border border-indigo-800">
          <span>🔊 讀生字</span>
        </button>

        <button id="btn-open-moe-newtab" title="複製字詞並開啟教育部首頁對照" class="text-xs sm:text-sm flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition font-medium border border-slate-300">
          <span>🔗 教育部官網對照</span>
        </button>
      </div>
    </div>

    <!-- 橫向生字選擇膠囊列 -->
    <div class="border-t border-slate-100 bg-slate-50 px-4 sm:px-6 py-2">
      <div class="max-w-7xl mx-auto flex items-center gap-2">
        <button id="btn-prev-char" title="上一個生字" class="px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 font-bold transition flex-shrink-0">
          ◀
        </button>

        <div id="character-pills-container" class="flex-1 flex items-center gap-2 overflow-x-auto horizontal-scroll py-1 px-1 min-h-[46px]">
        </div>

        <button id="btn-next-char" title="下一個生字" class="px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 font-bold transition flex-shrink-0">
          ▶
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-5 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- 左側：純田字格 -->
    <section class="lg:col-span-7 flex flex-col items-center">
      <div class="w-full max-w-[380px] flex items-center justify-between mb-2.5 p-1 bg-slate-200 rounded-xl text-xs font-semibold">
        <button id="tab-hanzi-mode" class="flex-1 py-1.5 rounded-lg bg-white text-indigo-900 border border-slate-300 transition font-bold">
          互動手寫模式
        </button>
        <button id="tab-moe-mode" class="flex-1 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition font-medium">
          教育部標準筆順模式
        </button>
      </div>

      <div class="w-full max-w-[380px] aspect-square relative mb-3.5 flex justify-center">
        <div class="tianzige-container">
          <svg class="tianzige-grid" viewBox="0 0 380 380" preserveAspectRatio="none">
            <line x1="0" y1="190" x2="380" y2="190" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,4" opacity="0.75" />
            <line x1="190" y1="0" x2="190" y2="380" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,4" opacity="0.75" />
            <rect x="2" y="2" width="376" height="376" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.35" />
          </svg>

          <div id="writer-target"></div>
          <div id="moe-view-target"></div>
        </div>
      </div>

      <div id="status-card" class="w-full max-w-[380px] mb-3.5 p-3 rounded-xl border transition-all duration-300 flex items-center justify-between bg-slate-100 border-slate-200 text-slate-700">
        <div>
          <p id="status-title" class="text-xs font-semibold text-slate-800">互動手寫模式</p>
          <p id="status-message" class="text-xs text-slate-500">點擊「播放筆順」觀察運筆，或按「手寫測驗」在田字格描紅！</p>
        </div>
        <div id="stroke-counter-badge" class="hidden text-right flex-shrink-0 pl-2">
          <span class="text-[10px] text-slate-400 block">筆畫進度</span>
          <p id="stroke-progress-text" class="text-sm font-bold text-indigo-700 font-mono leading-none">0/0</p>
        </div>
      </div>

      <div id="controls-hanzi" class="w-full max-w-[380px] space-y-2.5">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
          <button id="btn-animate" class="flex flex-col items-center justify-center p-2.5 rounded-xl bg-indigo-700 hover:bg-indigo-800 text-white font-medium transition active:scale-95">
            <span class="text-base mb-0.5">▶</span>
            <span class="text-xs">播放筆順</span>
          </button>

          <button id="btn-loop" class="flex flex-col items-center justify-center p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium border border-slate-300 transition active:scale-95">
            <span class="text-base mb-0.5 text-indigo-700">🔁</span>
            <span class="text-xs" id="btn-loop-text">循環播放</span>
          </button>

          <button id="btn-quiz" class="flex flex-col items-center justify-center p-2.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-medium transition active:scale-95">
            <span class="text-base mb-0.5">✍️</span>
            <span class="text-xs">手寫測驗</span>
          </button>

          <button id="btn-reset" class="flex flex-col items-center justify-center p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium border border-slate-300 transition active:scale-95">
            <span class="text-base mb-0.5 text-slate-500">🔄</span>
            <span class="text-xs">清空重設</span>
          </button>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2 p-2 rounded-xl bg-white border border-slate-200 text-xs">
          <button id="btn-toggle-outline" class="flex items-center gap-1 px-3 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition font-medium border border-slate-300">
            <span id="text-toggle-outline">隱藏底字</span>
          </button>

          <div class="flex items-center gap-1">
            <span class="text-slate-400 mr-1 text-[11px] font-medium">速度：</span>
            <button class="speed-btn px-2 py-0.5 rounded-md text-xs font-medium border border-slate-200 hover:bg-slate-50 text-slate-600 transition" data-speed="0.6">慢 (0.6x)</button>
            <button class="speed-btn px-2 py-0.5 rounded-md text-xs font-medium bg-indigo-50 border border-indigo-300 text-indigo-800 transition" data-speed="1.0">標準 (1.0x)</button>
            <button class="speed-btn px-2 py-0.5 rounded-md text-xs font-medium border border-slate-200 hover:bg-slate-50 text-slate-600 transition" data-speed="1.6">快 (1.6x)</button>
          </div>
        </div>
      </div>

      <div id="controls-moe" class="w-full max-w-[380px] hidden space-y-2.5">
        <div class="grid grid-cols-3 gap-2">
          <button id="btn-moe-play" class="flex items-center justify-center gap-1 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-medium text-xs transition active:scale-95">
            <span>▶ 播放全字</span>
          </button>
          <button id="btn-moe-step" class="flex items-center justify-center gap-1 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 font-medium text-xs transition active:scale-95">
            <span id="btn-moe-step-text">⏭ 分步下一筆</span>
          </button>
          <button id="btn-moe-reset" class="flex items-center justify-center gap-1 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 font-medium text-xs transition active:scale-95">
            <span>🔄 重設</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 右側：字卡、直式注音、字義、延伸詞語、叮嚀 -->
    <section class="lg:col-span-5 space-y-3.5">
      <div class="bg-white rounded-2xl p-4.5 border border-slate-200 relative overflow-hidden">
        <div class="absolute -right-5 -bottom-5 text-slate-100 font-serif text-9xl select-none pointer-events-none opacity-40" id="bg-char-watermark">
          待
        </div>

        <div class="flex items-start gap-4">
          <div id="char-display-badge" title="點擊聆聽發音" class="cursor-pointer group flex flex-col items-center justify-center w-24 h-24 rounded-2xl bg-indigo-50 border-2 border-indigo-200 text-indigo-950 hover:bg-indigo-100 transition-all flex-shrink-0">
            <span id="detail-char" class="font-serif text-5xl font-black group-hover:scale-105 transition-transform">待</span>
            <span class="text-[10px] text-indigo-700 flex items-center gap-0.5 mt-0.5 font-medium">
              <span>🔊 臺灣女聲</span>
            </span>
          </div>

          <div class="flex-1 space-y-2">
            <div>
              <div class="inline-flex items-center justify-center bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 min-h-[62px] min-w-[56px]">
                <div id="detail-zhuyin" class="flex items-center justify-center">
                </div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-0.5">
              <div class="bg-slate-50 rounded-xl p-2 border border-slate-200 text-center flex flex-col justify-center">
                <span class="text-[10px] text-slate-500 block">課次</span>
                <span id="detail-lesson-badge" class="text-sm font-bold text-indigo-800 font-serif">第一課</span>
              </div>
              <div class="bg-slate-50 rounded-xl p-2 border border-slate-200 text-center flex flex-col justify-center">
                <span class="text-[10px] text-slate-500 block">版本</span>
                <span class="text-sm font-bold text-amber-700 font-mono">翰林三上</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 1. 字義詮釋與課文理解 -->
      <div class="bg-white rounded-2xl p-4 border border-slate-200 space-y-2">
        <div class="flex items-center gap-2 text-teal-800 font-semibold text-xs sm:text-sm">
          <span class="text-base">📖</span>
          <span>字義詮釋與課文理解</span>
        </div>
        <p id="detail-char-meaning" class="text-xs sm:text-sm text-slate-700 leading-relaxed pl-6 font-serif">
          停留以達到某種目的。如：「等待」、「期待」。課文中指耐心停留。
        </p>
      </div>

      <!-- 2. 延伸詞語 -->
      <div class="bg-white rounded-2xl p-4 border border-slate-200 space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2 text-indigo-900 font-semibold text-xs sm:text-sm">
            <span class="text-base">🏷️</span>
            <span>延伸詞語（點擊查看解釋與發音）</span>
          </div>
          <span class="text-[10px] text-teal-700 bg-teal-50 border border-teal-200 px-2 py-0.5 rounded-full font-medium">教育部簡編本權威釋義</span>
        </div>

        <div id="word-detail-panel" class="hidden p-3.5 rounded-xl border border-teal-300 bg-teal-50/70 space-y-2 transition-all">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span id="panel-word-title" class="text-base font-bold text-teal-950 font-serif">等待</span>
              <span class="text-[10px] bg-teal-800 text-white px-2 py-0.5 rounded-md font-medium">【教育部國語辭典簡編本】</span>
            </div>
            <div class="flex items-center gap-1.5">
              <button id="btn-panel-speak" class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white border border-teal-300 text-teal-800 hover:bg-teal-100 text-xs font-semibold transition">
                <span>🔊 發音</span>
              </button>
              <button id="btn-panel-close" class="px-2 py-0.5 rounded-lg text-slate-400 hover:text-slate-600 font-bold" title="關閉解釋">
                ✕
              </button>
            </div>
          </div>
          <p id="panel-word-desc" class="text-xs sm:text-sm text-teal-950/90 leading-relaxed font-serif">
            不採取行動，直到所期望的人、事、物出現。
          </p>
        </div>

        <div id="detail-words-container" class="flex flex-wrap gap-2 pl-1 min-h-[38px]">
        </div>
      </div>

      <!-- 3. 書寫小叮嚀 -->
      <div class="bg-amber-50/70 rounded-2xl p-4 border border-amber-200 space-y-1.5">
        <div class="flex items-center gap-2 text-amber-900 font-semibold text-xs sm:text-sm">
          <span class="text-base">✏️</span>
          <span>書寫小叮嚀（筆順與結構）</span>
        </div>
        <div class="text-xs sm:text-sm text-amber-950/90 leading-relaxed pl-6 font-sans" id="detail-tips">
          依教育部常用國字標準字體筆順練習，注意各部件架構與起筆位置。
        </div>
      </div>
    </section>
  </main>

  <script>
    const PRONUNCIATION_FIXES = {
      "待": "岱",
      "等待": "等岱",
      "招待": "招岱",
      "期待": "期岱",
      "彈": "壇",
      "彈簧": "壇簧",
      "重疊": "蟲疊",
      "折斷": "哲斷"
    };

    const LESSONS_DATABASE = [
      {
        id: 1,
        title: "第一課",
        characters: [
          { char: "待", zhuyin: "ㄉㄞˋ", meaning: "停留以達到某種目的。如：「等待」、「期待」。課文中指耐心停留。", tip: "雙人旁立於左；右下寸字橫短豎鉤長，起筆注意平衡。", words: [{ word: "等待", desc: "不採取行動，直到所期望的人事物出現。" }, { word: "招待", desc: "接待、款待賓客。" }, { word: "期待", desc: "期盼等待。" }] },
          { char: "蝸", zhuyin: "ㄍㄨㄚ", meaning: "軟體動物名。頭部有觸角，背負螺旋狀扁圓外殼。", tip: "左側「虫」底橫變提；右側「咼」上內為冂，下口平正。", words: [{ word: "蝸牛", desc: "腹足綱軟體動物，背負螺旋狀貝殼。" }, { word: "蝸居", desc: "比喻狹小簡陋的居所。" }] },
          { char: "牛", zhuyin: "ㄋㄧㄡˊ", meaning: "草食反芻哺乳動物，角中空不脫落，體格健壯。", tip: "首撇短促傾斜；第二橫短、第三橫長，中豎直挺。", words: [{ word: "牛肉", desc: "牛的肌肉，供食用。" }, { word: "牛奶", desc: "母牛產出的乳汁。" }, { word: "黃牛", desc: "常見家畜牛種；亦指票販販子。" }] },
          { char: "牠", zhuyin: "ㄊㄚ", meaning: "代名詞，專指人類以外的動物。", tip: "左側牛字旁末筆挑起；右側也字豎彎鉤圓潤舒展。", words: [{ word: "牠們", desc: "對人類以外多數動物的代稱。" }, { word: "牠的", desc: "動物的所有格稱呼。" }] },
          { char: "吞", zhuyin: "ㄊㄨㄣ", meaning: "不咀嚼直接咽下；兼併霸佔。", tip: "上天撇捺舒展；下口扁平居中承托。", words: [{ word: "慢吞吞", desc: "說話或動作極緩慢的樣子。" }, { word: "吞嚥", desc: "咽下食物。" }, { word: "獨吞", desc: "獨自佔有全部好處利益。" }] },
          { char: "寸", zhuyin: "ㄘㄨㄣˋ", meaning: "度量衡長度單位，十寸為一尺；極短小。", tip: "首橫開展微揚；豎鉤垂直；點在交接右下方。", words: [{ word: "一寸光陰", desc: "極短暫的寶貴時間。" }, { word: "尺寸", desc: "物件長短之度量標準。" }, { word: "寸步不離", desc: "形影不離，緊緊跟隨。" }] },
          { char: "碌", zhuyin: "ㄌㄨˋ", meaning: "事情繁多奔忙；平凡庸俗。", tip: "左石窄小讓位；右彔下部四點水相互呼應。", words: [{ word: "忙碌", desc: "事情繁多，不得空閒。" }, { word: "勞碌", desc: "辛苦忙碌工作。" }, { word: "庸碌", desc: "平庸無所作為。" }] },
          { char: "奔", zhuyin: "ㄅㄣ", meaning: "急步快跑；投奔。", tip: "上大撇捺如展翅之姿；下三十均稱密集。", words: [{ word: "奔跑", desc: "快速向前快跑。" }, { word: "狂奔", desc: "迅猛奔馳。" }, { word: "飛奔", desc: "如飛一樣飛快奔跑。" }] },
          { char: "彈", zhuyin: "ㄊㄢˊ", meaning: "以手指拉物使其彈回發射；有彈性。", tip: "左弓挺直；右單字上兩點向內呼應，下橫平豎直。", words: [{ word: "彈簧", desc: "具彈性回縮特性的螺旋鋼絲零件。" }, { word: "彈性", desc: "物體受外力變形後復原的特性。" }, { word: "彈珠", desc: "小圓球玻璃童玩玩具。" }] },

    // 專屬發音函式：雙字詞加入微空格與降速，達到自然清晰字距
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      let clean = text.trim();
      if (PRONUNCIATION_FIXES[clean]) {
        clean = PRONUNCIATION_FIXES[clean];
      }

      let isMultiWord = clean.length >= 2;
      // 關鍵：在字與字之間加入半形空格，創造 120ms 自然字間停頓，結尾加句號保護尾音
      let spokenText = isMultiWord ? clean.split('').join(' ') + '。' : clean + '。';

      const utterance = new SpeechSynthesisUtterance(spokenText);
      utterance.lang = 'zh-TW';
      // 雙字詞速度放慢至 0.68，單字 0.72，教學聆聽最清晰
      utterance.rate = isMultiWord ? 0.68 : 0.72;
      utterance.pitch = 1.22;
      utterance.volume = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const twFemaleVoice = voices.find(v => 
        (v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW' || v.lang.includes('TW')) &&
        (v.name.includes('HsiaoChen') || v.name.includes('Yating') || v.name.includes('Mei-Jia') || 
         v.name.includes('HanHan') || v.name.includes('Sin-Ji') || v.name.includes('臺灣女') || v.name.includes('Female'))
      ) || voices.find(v => 
        (v.lang === 'zh-TW' || v.lang.includes('TW')) && 
        !v.name.includes('Danny') && !v.name.includes('YunJhe') && !v.name.includes('Male')
      );

      if (twFemaleVoice) {
        utterance.voice = twFemaleVoice;
      }
      
      window.speechSynthesis.speak(utterance);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    function renderVerticalZhuyin(zhuyinStr) {
      if (!zhuyinStr) return '';
      const str = zhuyinStr.trim();
      const isLightTone = str.includes('˙') || str.includes('•') || str.includes('·');
      const bodyChars = str.replace(/[ˊˇˋ˙•·\s]/g, '').split('');
      let toneMark = '';
      if (str.includes('ˊ')) toneMark = 'ˊ';
      else if (str.includes('ˇ')) toneMark = 'ˇ';
      else if (str.includes('ˋ')) toneMark = 'ˋ';

      return `
        <div class="inline-flex items-center justify-center font-serif select-none py-0.5">
          <div class="flex flex-col items-center justify-center">
            ${isLightTone ? '<span class="text-xs text-rose-600 font-bold mb-0.5 leading-none">˙</span>' : ''}
            <div class="flex flex-col items-center justify-center space-y-0.5">
              ${bodyChars.map(c => `<span class="text-xl sm:text-2xl font-bold text-slate-800 leading-none font-serif">${c}</span>`).join('')}
            </div>
          </div>
          <div class="w-3 flex flex-col justify-end items-start ml-1 self-stretch pb-0.5">
            ${toneMark ? `<span class="text-base sm:text-lg font-bold text-rose-600 leading-none font-serif">${toneMark}</span>` : ''}
          </div>
        </div>
      `;
    }

    function updateStatus(type, title, message, currentStroke = null, totalStrokes = null) {
      if (statusTitle) statusTitle.textContent = title;
      if (statusMessage) statusMessage.textContent = message;

      if (strokeCounterBadge && strokeProgressText) {
        if (currentStroke !== null && totalStrokes !== null) {
          strokeCounterBadge.classList.remove('hidden');
          strokeProgressText.textContent = `${currentStroke}/${totalStrokes}`;
        } else {
          strokeCounterBadge.classList.add('hidden');
        }
      }
    }

    function initHanziWriter(character) {
      if (!character) return;
      isLooping = false;
      isQuizActive = false;
      if (btnLoopText) btnLoopText.textContent = '循環播放';

      writerTarget.innerHTML = '';
      const size = 320;

      try {
        writerInstance = HanziWriter.create('writer-target', character, {
          width: size,
          height: size,
          padding: 24,
          showOutline: isShowOutline,
          strokeAnimationSpeed: currentSpeed,
          delayBetweenStrokes: 130,
          strokeColor: '#1d4ed8',
          radicalColor: '#0284c7',
          outlineColor: '#cbd5e1',
          drawingColor: '#ea580c',
          drawingWidth: 16,
          showHintAfterMisses: 2,
          highlightOnComplete: true,
          highlightColor: '#2563eb'
        });

        if (currentMode === 'hanzi') {
          updateStatus('ready', '互動手寫模式', `當前生字：「${character}」，純田字格已就緒！`);
        }
      } catch (err) {
        console.error('HanziWriter init error:', err);
      }
    }

    function initMoeWriter(character) {
      if (!character) return;
      moeViewTarget.innerHTML = '';
      moeCurrentStroke = 0;
      const size = 320;

      try {
        moeWriterInstance = HanziWriter.create('moe-view-target', character, {
          width: size,
          height: size,
          padding: 24,
          showOutline: true,
          strokeAnimationSpeed: 0.9,
          delayBetweenStrokes: 160,
          strokeColor: '#b45309',
          radicalColor: '#d97706',
          outlineColor: '#e2e8f0',
          highlightColor: '#f59e0b',
          onLoadCharDataSuccess: function(data) {
            moeTotalStrokes = data.strokes.length;
            updateStatus('writing', '教育部標準筆順模式', `「${character}」字（共 ${moeTotalStrokes} 畫），可點擊「播放全字筆順」或「分步下一筆」！`, 0, moeTotalStrokes);
          }
        });
      } catch (err) {
        console.error('MoeWriter init error:', err);
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const data = getCurrentCharData();

      if (mode === 'hanzi') {
        tabHanziMode.className = 'flex-1 py-1.5 rounded-lg bg-white text-indigo-900 border border-slate-300 transition font-bold';
        tabMoeMode.className = 'flex-1 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition font-medium';

        writerTarget.style.display = 'flex';
        moeViewTarget.style.display = 'none';
        controlsHanzi.classList.remove('hidden');
        controlsMoe.classList.add('hidden');

        initHanziWriter(data.char);
      } else {
        tabMoeMode.className = 'flex-1 py-1.5 rounded-lg bg-white text-amber-900 border border-amber-300 transition font-bold';
        tabHanziMode.className = 'flex-1 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition font-medium';

        writerTarget.style.display = 'none';
        moeViewTarget.style.display = 'flex';
        controlsHanzi.classList.add('hidden');
        controlsMoe.classList.remove('hidden');

        initMoeWriter(data.char);
      }
    }

    btnMoePlay.onclick = () => {
      if (!moeWriterInstance) return;
      const data = getCurrentCharData();
      moeCurrentStroke = moeTotalStrokes;
      updateStatus('writing', '播放標準筆順中', `正在自動演示「${data.char}」字標準筆順運筆～`, moeTotalStrokes, moeTotalStrokes);
      moeWriterInstance.animateCharacter({
        onComplete: function() {
          updateStatus('ready', '播放完成', `「${data.char}」字全字標準筆順演示完畢！`, moeTotalStrokes, moeTotalStrokes);
        }
      });
    };

    btnMoeStep.onclick = () => {
      if (!moeWriterInstance) return;
      const data = getCurrentCharData();

      if (moeCurrentStroke >= moeTotalStrokes) {
        moeCurrentStroke = 0;
        moeWriterInstance.hideCharacter();
        moeWriterInstance.showOutline();
      }

      moeWriterInstance.animateStroke(moeCurrentStroke, {
        onComplete: function() {
          moeCurrentStroke++;
          updateStatus('writing', '分步示範進行中', `已演示至「${data.char}」字第 ${moeCurrentStroke} 筆，請點擊「分步下一筆」繼續！`, moeCurrentStroke, moeTotalStrokes);
          if (btnMoeStepText) {
            btnMoeStepText.textContent = (moeCurrentStroke < moeTotalStrokes) ? `⏭ 分步 (${moeCurrentStroke}/${moeTotalStrokes})` : '🔄 重新分步';
          }
        }
      });
    };

    btnMoeReset.onclick = () => {
      if (!moeWriterInstance) return;
      const data = getCurrentCharData();
      moeCurrentStroke = 0;
      moeWriterInstance.hideCharacter();
      moeWriterInstance.showOutline();

    };

    function populateLessonDropdown() {
      lessonSelect.innerHTML = '';
      LESSONS_DATABASE.forEach(lesson => {
        const opt = document.createElement('option');
        opt.value = lesson.id;
        opt.textContent = `${lesson.title} (${lesson.characters.length}字)`;
        lessonSelect.appendChild(opt);
      });

      lessonSelect.value = currentLessonId;
      lessonSelect.onchange = (e) => {
        currentLessonId = parseInt(e.target.value, 10);
        currentWordIndex = 0;
        renderPills();
        loadCurrentCharacter();
      };
    }

    function getCurrentLesson() {
      return LESSONS_DATABASE.find(l => l.id === currentLessonId) || LESSONS_DATABASE[0];
    }

    function getCurrentCharData() {
      const lesson = getCurrentLesson();
      return lesson.characters[currentWordIndex] || lesson.characters[0];
    }

    function renderPills() {
      pillsContainer.innerHTML = '';
      const lesson = getCurrentLesson();

      lesson.characters.forEach((item, index) => {
        const btn = document.createElement('button');
        const isActive = index === currentWordIndex;
        btn.className = `flex-shrink-0 flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl border transition-all ${
          isActive 
            ? 'bg-indigo-800 text-white border-indigo-900 font-bold ring-2 ring-indigo-300'
            : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100 hover:border-indigo-400 font-medium'
        }`;

        const zhuyinStr = (item.zhuyin || "").trim();
        const isLightTone = zhuyinStr.includes('˙') || zhuyinStr.includes('•') || zhuyinStr.includes('·');
        const bodyChars = zhuyinStr.replace(/[ˊˇˋ˙•·\s]/g, '').split('');
        let toneMark = '';
        if (zhuyinStr.includes('ˊ')) toneMark = 'ˊ';
        else if (zhuyinStr.includes('ˇ')) toneMark = 'ˇ';
        else if (zhuyinStr.includes('ˋ')) toneMark = 'ˋ';

        const toneColorClass = isActive ? 'text-amber-300' : 'text-rose-600';
        const bodyColorClass = isActive ? 'text-indigo-100' : 'text-slate-600';

        btn.innerHTML = `
          <span class="text-base sm:text-lg font-serif font-bold leading-none">${item.char}</span>
          <div class="inline-flex items-center justify-center font-serif select-none text-[10px] leading-none pl-0.5">
            <div class="flex flex-col items-center justify-center">
              ${isLightTone ? `<span class="${toneColorClass} font-bold leading-none mb-0.5 text-[8px]">˙</span>` : ''}
              <div class="flex flex-col items-center justify-center space-y-[1px]">
                ${bodyChars.map(c => `<span class="${bodyColorClass} font-bold leading-none">${c}</span>`).join('')}
              </div>
            </div>
            <div class="w-1.5 flex flex-col justify-end items-start ml-0.5 self-stretch">
              ${toneMark ? `<span class="${toneColorClass} font-bold leading-none text-[9px]">${toneMark}</span>` : ''}
            </div>
          </div>
        `;
        btn.onclick = () => {
          if (currentWordIndex !== index) {
            currentWordIndex = index;
            renderPills();
            loadCurrentCharacter();
          }
        };
        pillsContainer.appendChild(btn);
      });

      const activeElement = pillsContainer.children[currentWordIndex];
      if (activeElement) {
        activeElement.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }

    function openWordDetail(wordItem) {
      activeWordObj = wordItem;
      panelWordTitle.textContent = wordItem.word;
      panelWordDesc.textContent = wordItem.desc || "教育部國語辭典簡編本釋義。";
      wordDetailPanel.classList.remove('hidden');

      const buttons = detailWordsContainer.querySelectorAll('button');
      buttons.forEach(btn => {
        if (btn.getAttribute('data-word') === wordItem.word) {
          btn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-teal-800 text-white border border-teal-900 transition text-xs font-medium font-serif';
        } else {
          btn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 transition text-xs font-medium';
        }
      });
      speakText(wordItem.word);
    }

    btnPanelClose.onclick = () => {
      wordDetailPanel.classList.add('hidden');
      const buttons = detailWordsContainer.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 transition text-xs font-medium';
      });
    };

    btnPanelSpeak.onclick = () => {
      if (activeWordObj) {
        speakText(activeWordObj.word);
      }
    };

    function loadCurrentCharacter() {
      const lesson = getCurrentLesson();
      const data = getCurrentCharData();
      if (!data) return;

      if (detailChar) detailChar.textContent = data.char;
      if (bgCharWatermark) bgCharWatermark.textContent = data.char;
      if (detailZhuyin) detailZhuyin.innerHTML = renderVerticalZhuyin(data.zhuyin);
      if (detailLessonBadge) detailLessonBadge.textContent = `${lesson.title}`;

      if (detailCharMeaning) {
        detailCharMeaning.textContent = data.meaning || "請參閱教育部國語辭典簡編本字義解析。";
      }

      if (detailTips) {
        detailTips.textContent = data.tip || `依教育部標準字體筆順練習，留意「${data.char}」字起筆與結構平衡。`;
      }

      if (detailWordsContainer) {
        detailWordsContainer.innerHTML = '';
        wordDetailPanel.classList.add('hidden');

        const wordList = data.words || [
          { word: `${data.char}字`, desc: `「${data.char}」字的日常相關詞彙與用法。` }
        ];

        wordList.forEach((item) => {
          const wBtn = document.createElement('button');
          wBtn.setAttribute('data-word', item.word);
          wBtn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 transition text-xs font-medium';
          wBtn.innerHTML = `<span>${item.word}</span><span class="text-xs text-teal-600">📖</span>`;
          
          wBtn.onclick = (e) => {
            e.stopPropagation();
            openWordDetail(item);
          };
          detailWordsContainer.appendChild(wBtn);
        });

        if (wordList.length > 0) {
          openWordDetail(wordList[0]);
        }
      }

      if (currentMode === 'hanzi') {
        initHanziWriter(data.char);
      } else {
        initMoeWriter(data.char);
      }
    }

    btnAnimate.onclick = () => {
      if (!writerInstance) return;
      isLooping = false;
      isQuizActive = false;
      btnLoopText.textContent = '循環播放';
      writerInstance.cancelQuiz();
      writerInstance.showCharacter();
      updateStatus('writing', '播放筆順中', '仔細觀察筆順起筆、行筆與收筆位置～');
      writerInstance.animateCharacter({
        onComplete: function() {
          updateStatus('ready', '播放完成', '觀看結束！可再次播放或開始手寫練習。');
        }
      });
    };

    btnLoop.onclick = () => {
      if (!writerInstance) return;
      if (!isLooping) {
        isLooping = true;
        isQuizActive = false;
        btnLoopText.textContent = '停止循環';
        writerInstance.cancelQuiz();
        writerInstance.showCharacter();
        writerInstance.loopCharacterAnimation();
        updateStatus('writing', '循環示範中', '持續展示標準書寫筆順，點擊「停止循環」可暫停。');
      } else {
        isLooping = false;
        btnLoopText.textContent = '循環播放';
        writerInstance.pauseAnimation();
        updateStatus('ready', '已停止示範', '可點擊手寫測驗開始親手在純田字格描紅！');
      }
    };

    btnQuiz.onclick = () => {
      if (!writerInstance) return;
      isLooping = false;
      btnLoopText.textContent = '循環播放';
      isQuizActive = true;

      const data = getCurrentCharData();
      updateStatus('writing', '手寫測驗進行中', '請依標準筆順在純田字格描紅！寫錯兩次會提供貼心指引。', 0, 0);

      writerInstance.quiz({
        onMistake: function(strokeData) {
          updateStatus('mistake', '筆順提醒', `筆畫方向或位置不對喔！還有 ${strokeData.strokesRemaining} 畫，加油！`, strokeData.strokeNum, strokeData.strokeNum + strokeData.strokesRemaining);
        },
        onCorrectStroke: function(strokeData) {
          const current = strokeData.strokeNum + 1;
          const total = strokeData.strokeNum + strokeData.strokesRemaining + 1;
          updateStatus('writing', '寫得真棒！', `第 ${current} 筆正確，請繼續寫下一筆！`, current, total);
        },
        onComplete: function(summaryData) {
          isQuizActive = false;
          if (summaryData.totalMistakes === 0) {
            updateStatus('success', '太厲害了！全對滿分！🎉', `零失誤一氣呵成！「${data.char}」字掌握得非常扎實！`);
            speakText(`太棒了！「${data.char}」字書寫完全正確！`);
          } else {
            updateStatus('success', '恭喜完成練習！👏', `成功寫完「${data.char}」字！熟能生巧！`);
            speakText(`恭喜完成「${data.char}」字的書寫練習！`);
          }
        }
      });
    };

    btnReset.onclick = () => {
      if (!writerInstance) return;
      isLooping = false;
      isQuizActive = false;
      btnLoopText.textContent = '循環播放';
      writerInstance.cancelQuiz();
      writerInstance.showCharacter();
      if (isShowOutline) {
        writerInstance.showOutline();
      } else {
        writerInstance.hideOutline();
      }
      const data = getCurrentCharData();
      updateStatus('ready', '田字格已清空', `已恢復「${data.char}」初始狀態。`);
    };

    btnToggleOutline.onclick = () => {
      if (!writerInstance) return;
      isShowOutline = !isShowOutline;
      if (isShowOutline) {
        writerInstance.showOutline();
        textToggleOutline.textContent = '隱藏底字';
      } else {
        writerInstance.hideOutline();
        textToggleOutline.textContent = '顯示底字';
      }
    };

    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.onclick = (e) => {
        const speed = parseFloat(e.currentTarget.getAttribute('data-speed'));
        currentSpeed = speed;
        document.querySelectorAll('.speed-btn').forEach(b => {
          b.className = 'speed-btn px-2 py-0.5 rounded-md text-xs font-medium border border-slate-200 hover:bg-slate-50 text-slate-600 transition';
        });
        e.currentTarget.className = 'speed-btn px-2 py-0.5 rounded-md text-xs font-medium bg-indigo-50 border border-indigo-300 text-indigo-800 transition';

        const data = getCurrentCharData();
        if (data && currentMode === 'hanzi') initHanziWriter(data.char);
      };
    });

    btnPrevChar.onclick = () => {
      const lesson = getCurrentLesson();
      if (currentWordIndex > 0) {
        currentWordIndex--;
      } else {
        currentWordIndex = lesson.characters.length - 1;
      }
      renderPills();
      loadCurrentCharacter();
    };

    btnNextChar.onclick = () => {
      const lesson = getCurrentLesson();
      if (currentWordIndex < lesson.characters.length - 1) {
        currentWordIndex++;
      } else {
        currentWordIndex = 0;
      }
      renderPills();
      loadCurrentCharacter();
    };

    btnReadCharacter.onclick = () => {
      const data = getCurrentCharData();
      if (data) speakText(data.char);
    };

    charDisplayBadge.onclick = () => {
      const data = getCurrentCharData();
      if (data) speakText(data.char);
    };

    btnOpenMoeNewTab.onclick = () => {
      const data = getCurrentCharData();
      if (data) {
        navigator.clipboard.writeText(data.char).then(() => {
          alert(`已自動為您複製「${data.char}」字！即將前往教育部筆順網首頁，貼上即可快速對照。`);
          window.open('https://stroke-order.learningweb.moe.edu.tw/', '_blank');
        }).catch(() => {
          window.open('https://stroke-order.learningweb.moe.edu.tw/', '_blank');
        });
      }
    };

    function startApp() {
      try {
        populateLessonDropdown();
        renderPills();
        loadCurrentCharacter();
      } catch (err) {
        console.error("Initialization error:", err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }
  </script>
</body>
</html>
